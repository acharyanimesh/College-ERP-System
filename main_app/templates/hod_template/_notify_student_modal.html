<div class="modal fade" id="myModal" tabindex="-1" role="dialog"
   aria-labelledby="myModalLabel" aria-hidden="true">
   <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
         <div class="modal-header">Send Notification
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-hidden="true"></button>
         </div>
         <div class="modal-body">
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="4" class='form-control' placeholder="Type your message..."></textarea>
                <input type="hidden" id="student_id" class='form-control'>
            </div>
         </div>
         <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
            <button type="button" id='send' class="btn btn-success send_notification">Send Notification</button>
         </div>
      </div>
   </div>
</div>
